model:
  path: "/home/zxn/MomaGraph-R1"
  max_seq_len: 4096
  use_flash_attention: true
  gradient_checkpointing: true  

data:
  root_path: "/data/colosseum_dataset/expert"
  sft_split: "expert"
  sft_max_samples: 600000  # 50000
  num_workers: 8           # Data loading threads per DDP process
  prefetch_factor: 2       # Prefetch 2x samples into memory buffer

training:
  max_grad_norm: 1.0       # Gradient clipping threshold
  sft:
    epochs: 4
    # max_steps: 10000       # Total training steps
    batch_size: 1          # Samples per GPU (VRAM dependent)
    learning_rate: 2e-5    # Initial learning rate
    warmup_steps: 1500      # Learning rate warmup steps
    grad_accumulation_steps: 32  # Global batch size = 8 GPUs * 1 bs * 32 acc = 256